name: Build and test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-artifacts:
        description: Retain native libraries for the Release package bundle
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/artifacts/ci-dotnet
  DOTNET_ROOT: ${{ github.workspace }}/artifacts/ci-dotnet
  NUGET_PACKAGES: ${{ github.workspace }}/.packages

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.classify.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect build inputs
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --no-renames --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-paths"
          build=false
          while IFS= read -r -d '' file; do
            case "$file" in
              docs/*|README.md|AGENTS.md) ;;
              *) build=true ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  desktop:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: ${{ matrix.rid }} build, tests and NativeAOT
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            target: x86_64-pc-windows-msvc
            native-directory: windows
            exe: .exe
          - os: ubuntu-24.04
            rid: linux-x64
            target: x86_64-unknown-linux-gnu
            native-directory: linux-x64
            exe: ''
          - os: macos-15
            rid: osx-arm64
            target: aarch64-apple-darwin
            native-directory: osx-arm64
            exe: ''
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
      SODIUM_DIST_DIR: ${{ github.workspace }}/artifacts/native-source/ci

    steps:
      - name: Preserve checksum-addressed source bytes
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-validation

      - name: Install Linux build and desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang pkg-config zlib1g-dev libssl-dev libsqlite3-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev \
            xvfb xserver-xephyr xfwm4 xfce4-panel dbus-x11 x11-utils

      - name: Prepare macOS build tools
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          xcrun --find clang
          brew install cmake pkgconf libsodium
          echo 'MACOSX_DEPLOYMENT_TARGET=12.0' >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: |
          rust_version=$(node -p "require('./native/dependency-lock.json').rust.channel")
          rustup toolchain install "$rust_version" --profile minimal
          echo "RUST_VERSION=$rust_version" >> "$GITHUB_ENV"

      - name: Cache native dependencies
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            artifacts/native-target
          key: native-${{ matrix.os }}-${{ matrix.rid }}-${{ hashFiles('native/Cargo.toml', 'native/Cargo.lock', 'native/dependency-lock.json', 'native/rust-toolchain.toml') }}
          restore-keys: |
            native-${{ matrix.os }}-${{ matrix.rid }}-

      - name: Prepare verified libsodium inputs
        run: node scripts/prepare-native-dependencies.mjs '${{ matrix.rid }}' artifacts/native-source/ci

      - name: Build Windows native adapter
        id: native-windows
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/build-native.ps1

      - name: Build Unix native adapter
        id: native-unix
        if: runner.os != 'Windows'
        run: bash scripts/build-native.sh

      - name: Rust unit tests
        run: |
          cargo +"$RUST_VERSION" test --locked --release --lib \
            --manifest-path native/netwiv-native/Cargo.toml \
            --target '${{ matrix.target }}' --target-dir 'artifacts/native-target/${{ matrix.native-directory }}'

      - name: Save compiled native dependencies
        if: always() && steps.native-cache.outputs.cache-hit != 'true' && (steps.native-windows.outcome == 'success' || steps.native-unix.outcome == 'success')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            artifacts/native-target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Build managed Core tests (full solution on Linux)
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            dotnet build NetWiv.sln -c Release
          else
            dotnet build tests/NetWiv.Core.Tests -c Release
          fi

      - name: Core tests
        run: dotnet run --project tests/NetWiv.Core.Tests -c Release --no-build

      - name: Publish Core tests with NativeAOT
        run: dotnet publish tests/NetWiv.Core.Tests -c Release -r '${{ matrix.rid }}' -p:PublishAot=true -o artifacts/ci/core-aot

      - name: Execute NativeAOT Core tests
        run: ./artifacts/ci/core-aot/NetWiv.Core.Tests${{ matrix.exe }}

      - name: Publish native desktop smoke host with NativeAOT
        run: dotnet publish tests/NetWiv.Desktop.Smoke -c Release -r '${{ matrix.rid }}' -p:PublishAot=true -o artifacts/ci/desktop-aot

      - name: Windows native startup diagnostics
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/test-native-startup.ps1 -PublishedDirectory artifacts/ci/desktop-aot

      - name: Unix native startup diagnostics
        if: runner.os != 'Windows'
        run: bash scripts/test-native-startup.sh artifacts/ci/desktop-aot

      - name: Ensure Windows WebView2 Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ensure-webview2.ps1

      - name: Windows NativeAOT WebView smoke
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke.exe --default-icon-smoke
          ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke.exe
          ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke.exe --lifetime-smoke default
          ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke.exe --lifetime-smoke resident
          ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke.exe --exit-request-smoke

      - name: Windows managed lifetime and persistent WebView profiles
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: |
          dotnet publish tests/NetWiv.Desktop.Smoke -c Release -r win-x64 -p:PublishAot=false -p:PublishTrimmed=false --self-contained false -o artifacts/ci/desktop-managed
          ./artifacts/ci/desktop-managed/NetWiv.Desktop.Smoke.exe
          ./artifacts/ci/desktop-managed/NetWiv.Desktop.Smoke.exe --lifetime-smoke default
          ./artifacts/ci/desktop-managed/NetWiv.Desktop.Smoke.exe --lifetime-smoke resident
          ./artifacts/ci/desktop-managed/NetWiv.Desktop.Smoke.exe --exit-request-smoke
          pwsh -NoProfile -File scripts/test-windows-webview-profile.ps1 -ManagedDirectory artifacts/ci/desktop-managed -AotDirectory artifacts/ci/desktop-aot

      - name: Managed Blazor Hybrid native WebView
        timeout-minutes: 10
        run: |
          dotnet publish tests/NetWiv.BlazorHybrid.Aot.Tests -c Release -r '${{ matrix.rid }}' -p:PublishAot=false -p:JsonSerializerIsReflectionEnabledByDefault=true -o artifacts/ci/blazor-managed
          executable="$PWD/artifacts/ci/blazor-managed/NetWiv.BlazorHybrid.Aot.Tests${{ matrix.exe }}"
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/run-linux-smoke-desktop.sh "$executable" x11 --managed-host --native-webview --back-forward
            xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/run-linux-smoke-desktop.sh "$executable" x11 --managed-rcl --native-webview
            xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/run-linux-smoke-desktop.sh "$executable" x11 --transport-navigation
            xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/run-linux-smoke-desktop.sh "$executable" x11 --registered-ipc
            xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/run-linux-smoke-desktop.sh "$executable" x11 --hostless-ipc
          else
            "$executable" --managed-host --native-webview --back-forward
            "$executable" --managed-rcl --native-webview
            "$executable" --registered-ipc
          fi

      - name: Experimental NativeAOT Blazor Hybrid
        timeout-minutes: 10
        run: |
          dotnet publish tests/NetWiv.BlazorHybrid.Aot.Tests -c Release -r '${{ matrix.rid }}' -p:PublishAot=true -o artifacts/ci/blazor-aot
          executable="$PWD/artifacts/ci/blazor-aot/NetWiv.BlazorHybrid.Aot.Tests${{ matrix.exe }}"
          "$executable"
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/run-linux-smoke-desktop.sh "$executable" x11 --native-webview --back-forward
            xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/run-linux-smoke-desktop.sh "$executable" x11 --registered-ipc
            xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/run-linux-smoke-desktop.sh "$executable" x11 --hostless-ipc
          else
            "$executable" --native-webview --back-forward
            "$executable" --registered-ipc
          fi

      - name: Linux X11 NativeAOT WebView smoke
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' \
            bash scripts/run-linux-smoke-desktop.sh "$(realpath artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke)" x11 --default-icon-smoke
          xvfb-run -a -s '-screen 0 1280x800x24' \
            bash scripts/run-linux-smoke-desktop.sh "$(realpath artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke)" x11
          for mode in default resident; do
            xvfb-run -a -s '-screen 0 1280x800x24' \
              bash scripts/run-linux-smoke-desktop.sh "$(realpath artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke)" x11 --lifetime-smoke "$mode"
          done
          xvfb-run -a -s '-screen 0 1280x800x24' \
            bash scripts/run-linux-smoke-desktop.sh "$(realpath artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke)" x11 --exit-request-smoke

      - name: Build Linux managed dialog regression host
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          dotnet build tests/NetWiv.Dialog.Smoke -c Release -p:PublishAot=false

      - name: Linux X11 managed dialog regression
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' \
            bash scripts/run-linux-smoke-desktop.sh "$(realpath tests/NetWiv.Dialog.Smoke/bin/Release/net8.0/NetWiv.Dialog.Smoke)" x11 --automatic x11

      - name: Publish Linux dialog regression host with NativeAOT
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: dotnet publish tests/NetWiv.Dialog.Smoke -c Release -r linux-x64 -p:PublishAot=true -o artifacts/ci/dialog-aot

      - name: Linux X11 NativeAOT dialog regression
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' \
            bash scripts/run-linux-smoke-desktop.sh "$(realpath artifacts/ci/dialog-aot/NetWiv.Dialog.Smoke)" x11 --automatic x11

      - name: macOS NativeAOT WKWebView smoke
        if: runner.os == 'macOS'
        timeout-minutes: 8
        env:
          # Concurrent WebContent processes can block in Metal's disk-cache flock
          # on macOS 15. Disable that cache in these XPC children, not GPU rendering.
          __XPC_MTL_SHADER_CACHE_SIZE: '0'
        run: |
          ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke --no-window-smoke
          ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke --default-icon-smoke
          ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke --effects-smoke
          ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke --reopen-smoke
          ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke --webview-options-smoke
          ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke
          ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke --lifetime-smoke default
          ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke --lifetime-smoke resident
          ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke --exit-request-smoke

      - name: Publish macOS isolation smoke with NativeAOT
        if: runner.os == 'macOS'
        run: dotnet publish tests/NetWiv.Isolation.Smoke -c Release -r '${{ matrix.rid }}' -p:PublishAot=true -o artifacts/ci/isolation-aot

      - name: macOS NativeAOT isolation smoke
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          ./artifacts/ci/isolation-aot/NetWiv.Isolation.Smoke

      - name: macOS NativeAOT App Sandbox package
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: |
          dotnet build src/NetWiv.Cli -c Release
          cli="$PWD/src/NetWiv.Cli/bin/Release/net8.0/netwiv.dll"
          cd tests/NetWiv.MacOS.Sandbox.Smoke
          dotnet "$cli" build --aot --target '${{ matrix.rid }}' --bundles app-store --no-sign
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          mkdir "$scratch/outside"
          export NETWIV_SANDBOX_OUTSIDE_DIRECTORY="$scratch/outside"
          pkgutil --expand-full target/'${{ matrix.rid }}'/release/bundle/app-store/*-unsigned.pkg "$scratch/expanded"
          app="$scratch/expanded/dev.netwiv.sandbox-smoke.pkg/Payload/NetWiv-Sandbox-Smoke.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/NetWiv.MacOS.Sandbox.Smoke" --sandbox write
          "$app/Contents/MacOS/NetWiv.MacOS.Sandbox.Smoke" --sandbox read

      - name: Upload validated native libraries for packaging
        if: inputs.release-artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native/
          retention-days: 1
          if-no-files-found: error

  cli:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: ${{ matrix.os }} CLI ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
        group: [contracts, lifecycle]
    defaults:
      run:
        shell: bash
    env:
      NETWIV_TEST_TEMPLATE_MATRIX: ${{ matrix.os == 'ubuntu-24.04' && 'full' || 'representative' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-validation
      - name: Prepare Linux AOT dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Prepare macOS CLI build tools
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          xcrun --find clang
          echo 'MACOSX_DEPLOYMENT_TARGET=12.0' >> "$GITHUB_ENV"
          if [[ '${{ matrix.group }}' == contracts ]]; then brew install cmake pkgconf libsodium; fi
      - name: Prepare pinned CLI test tools
        if: matrix.group == 'contracts'
        run: node scripts/prepare-test-tools.mjs
      - name: Prepare pinned NSIS for sidecar package consumers
        if: runner.os == 'Windows' && matrix.group == 'lifecycle'
        run: node scripts/prepare-nsis.mjs
      - name: Build CLI tests
        run: dotnet build tests/NetWiv.Cli.Tests -c Release
      - name: Check CLI group completeness
        if: matrix.os == 'ubuntu-24.04' && matrix.group == 'contracts'
        run: node scripts/check-cli-groups.mjs
      - name: macOS app and DMG packaging
        if: runner.os == 'macOS' && matrix.group == 'contracts'
        timeout-minutes: 5
        run: dotnet run --project tests/NetWiv.Cli.Tests -c Release --no-build -- --filter 'macOS application'
      - name: CLI tests
        run: |
          if [[ "$RUNNER_OS" == macOS && '${{ matrix.group }}' == contracts ]]; then
            dotnet run --project tests/NetWiv.Cli.Tests -c Release --no-build -- --group contracts --exclude 'macOS application'
          else
            dotnet run --project tests/NetWiv.Cli.Tests -c Release --no-build -- --group '${{ matrix.group }}'
          fi
      - name: Generator tests
        if: matrix.group == 'contracts'
        run: dotnet test tests/NetWiv.Generators.Tests -c Release
      - name: API tests
        if: matrix.group == 'contracts'
        run: dotnet test tests/NetWiv.Api.Tests -c Release
      - name: Managed Blazor Hybrid transport and lifecycle tests
        if: matrix.group == 'contracts'
        run: dotnet run --project tests/NetWiv.BlazorHybrid.Tests -c Release
      - name: Shared JavaScript harness and license tests
        if: runner.os == 'Linux' && matrix.group == 'contracts'
        run: |
          node --test tests/conformance/scripts/*.test.mjs \
            tests/NetWiv.Desktop.Smoke/*.test.mjs \
            tests/NetWiv.Dialog.Smoke/*.test.mjs \
            tests/NetWiv.MacOS.Sandbox.Smoke/*.test.mjs \
            tests/NetWiv.Isolation.Smoke/*.test.mjs \
            compatibility/scripts/upstream-test-inventory.test.mjs \
            native/netwiv-native/src/runtime/ipc.test.mjs \
            native/license-provenance.test.mjs
      - name: Windows owned-host cleanup tests
        if: runner.os == 'Windows' && matrix.group == 'contracts'
        run: node --test tests/conformance/scripts/run-host.test.mjs tests/NetWiv.Isolation.Smoke/run.test.mjs
      - name: Platform build-tool script tests
        if: matrix.group == 'contracts'
        run: node --test scripts/*.test.mjs
      - name: Release bundle tests
        if: runner.os == 'Linux' && matrix.group == 'contracts'
        run: python3 -m unittest discover -s scripts -p 'test_release_packages.py' -v
      - name: Package consumer project tests
        if: matrix.group == 'contracts'
        shell: pwsh
        run: ./scripts/test-package-smoke.ps1

  windows-installers:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: Windows installer lifecycle acceptance
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-validation
      - name: Prepare pinned NSIS compiler
        run: node scripts/prepare-nsis.mjs
      - name: Windows installer lifecycle acceptance
        timeout-minutes: 15
        shell: pwsh
        run: |
          dotnet build src/NetWiv.Cli -c Release
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed.' }
          $wixBin = Join-Path $env:WIX 'bin'
          if (-not (Test-Path (Join-Path $wixBin 'candle.exe'))) { throw 'WiX v3 is missing from the runner.' }
          $env:PATH = "$wixBin;$env:PATH"
          ./scripts/test-windows-installers.ps1

  frontend:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: Frontend API package and template consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Frontend API runtime tests
        run: |
          npm ci --prefix packages/api --no-audit --no-fund
          npm test --prefix packages/api
      - name: Packed frontend API consumer and public type boundaries
        run: node tests/frontend-api/run.mjs
      - name: TypeScript template builds
        run: node tests/template-matrix/build-frontends.mjs react vue svelte angular

  sdk-compatibility:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: .NET ${{ matrix.major }} SDK and runtime compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        major: [9, 10]
    env:
      NetWivTestFramework: net${{ matrix.major }}.0
      NETWIV_TEST_TEMPLATE_MATRIX: representative
      DOTNET_NOLOGO: '1'
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/artifacts/ci-dotnet
      DOTNET_ROOT: ${{ github.workspace }}/artifacts/ci-dotnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-validation
        with:
          dotnet-version: '${{ matrix.major }}.0.x'
      - name: Prepare AOT and CLI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev
          node scripts/prepare-test-tools.mjs
      - name: Build and test managed consumers
        run: |
          dotnet run --project tests/NetWiv.Core.Tests -c Release
          dotnet run --project tests/NetWiv.Cli.Tests -c Release
          dotnet test tests/NetWiv.Generators.Tests -c Release
          dotnet test tests/NetWiv.Api.Tests -c Release
          dotnet run --project tests/NetWiv.BlazorHybrid.Tests -c Release
      - name: Publish and execute NativeAOT Core tests
        run: |
          dotnet publish tests/NetWiv.Core.Tests -c Release -r linux-x64 -p:PublishAot=true -o artifacts/sdk-core-aot
          ./artifacts/sdk-core-aot/NetWiv.Core.Tests
      - name: Compile desktop consumer with the SDK default language version
        # Package consumers do not inherit the repository's C# 12 pin.
        # Compile the same smoke source without rebuilding native assets here.
        run: dotnet build tests/NetWiv.Desktop.Smoke -c Release -p:LangVersion=default -p:NetWivNativeRid=protocol-only
      - name: Publish and execute experimental Hybrid protocol tests
        run: |
          # Protocol mode does not enter the native backend. Keep native GUI
          # execution in desktop and package-consumer jobs, without rebuilding Rust here.
          dotnet publish tests/NetWiv.BlazorHybrid.Aot.Tests -c Release -r linux-x64 -p:PublishAot=true -p:NetWivNativeRid=protocol-only -o artifacts/sdk-hybrid-aot
          ./artifacts/sdk-hybrid-aot/NetWiv.BlazorHybrid.Aot.Tests

  required:
    name: CI required
    if: always()
    needs: [changes, desktop, cli, windows-installers, frontend, sdk-compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful validation or documentation-only changes
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          CLI_RESULT: ${{ needs.cli.result }}
          INSTALLER_RESULT: ${{ needs.windows-installers.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          SDK_RESULT: ${{ needs.sdk-compatibility.result }}
        run: |
          [[ "$CHANGES_RESULT" == success ]] || exit 1
          case "$BUILD_REQUIRED:$DESKTOP_RESULT:$CLI_RESULT:$INSTALLER_RESULT:$FRONTEND_RESULT:$SDK_RESULT" in
            true:success:success:success:success:success|false:skipped:skipped:skipped:skipped:skipped) exit 0 ;;
            *) echo "Required validation did not pass: $BUILD_REQUIRED:$DESKTOP_RESULT:$CLI_RESULT:$INSTALLER_RESULT:$FRONTEND_RESULT:$SDK_RESULT"; exit 1 ;;
          esac
