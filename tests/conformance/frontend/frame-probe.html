<!doctype html>
<meta charset="UTF-8">
<title>Origin conformance probe</title>
<script type="module">
  import { invoke } from './vendor/@tauri-apps/api/core.js';
  const id = new URL(location.href).searchParams.get('id');
  const result = { bridge: typeof window.__TAURI_INTERNALS__?.invoke === 'function', echo: 'unavailable', restricted: 'unavailable' };
  const input = { marker: 'origin-probe', source: 'tauri://localhost', origin: 'tauri://localhost' };
  for (const [field, command, args] of [['echo', 'echo_json', { input }], ['restricted', 'restricted', {}]]) {
    if (!result.bridge) continue;
    try {
      const value = await Promise.race([invoke(command, args), new Promise((_, reject) => setTimeout(() => reject(Error('probe timeout')), 4000))]);
      result[field] = field === 'echo' && (!value || Object.keys(value).length !== 3 || Object.keys(input).some(key => value[key] !== input[key])) ? 'wrong-value' : 'allowed';
    } catch (error) {
      result[field] = /not allowed|not permitted|Origin header is not a valid URL/.test(String(error)) ? 'denied' : 'error: ' + String(error);
    }
  }
  await fetch('http://127.0.0.1:18191/report?id=' + encodeURIComponent(id), { method: 'POST', body: JSON.stringify(result) });
</script>
