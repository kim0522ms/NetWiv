[package]
name = "netwiv-isolation-reference"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = ["isolation"] }

[dependencies]
serde_json = "1"
tauri = { version = "=2.11.5", features = ["isolation"] }
tokio = { version = "1", features = ["time", "sync"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[workspace]
