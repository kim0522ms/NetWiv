name: Bundle Release packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 scripts/release-packages.py version "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      release-artifacts: true

  bundle:
    needs: [version, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      DOTNET_NOLOGO: '1'
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/artifacts/pack-dotnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: artifacts/native
          merge-multiple: true
      - name: Pack the local feed
        shell: pwsh
        run: |
          $sdk = ((dotnet --list-sdks | Where-Object { $_ -match '^8\.' } | Select-Object -Last 1) -split ' ')[0]
          @{ sdk = @{ version = $sdk; rollForward = 'disable'; allowPrerelease = $false } } |
            ConvertTo-Json | Set-Content global.json
          ./scripts/pack-integration.ps1 -Version $env:RELEASE_VERSION -OutputDirectory artifacts/release-feed
      - name: Validate and bundle packages with licenses and checksums
        run: >-
          python3 scripts/release-packages.py bundle
          --feed artifacts/release-feed/packages --output artifacts/release
          --version "$RELEASE_VERSION" --revision "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: artifacts/release/
          retention-days: 1
          if-no-files-found: error

  package-compatibility:
    needs: [version, bundle]
    name: ${{ matrix.rid }} package consumers with only .NET ${{ matrix.major }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # Keep newer SDK/runtime coverage on Linux; validate each packaged native
        # RID on the baseline without multiplying all platforms by every SDK.
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            major: 8
          - os: ubuntu-24.04
            rid: linux-x64
            major: 9
          - os: ubuntu-24.04
            rid: linux-x64
            major: 10
          - os: windows-2025
            rid: win-x64
            major: 8
          - os: macos-15
            rid: osx-arm64
            major: 8
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      DOTNET_NOLOGO: '1'
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/artifacts/consumer-dotnet
      DOTNET_ROOT: ${{ github.workspace }}/artifacts/consumer-dotnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        id: sdk
        with:
          dotnet-version: '${{ matrix.major }}.0.x'
      - name: Restrict the private install to the selected runtime major
        shell: pwsh
        env:
          SDK_VERSION: ${{ steps.sdk.outputs.dotnet-version }}
          RUNTIME_MAJOR: ${{ matrix.major }}
        run: |
          # setup-dotnet also installs the current LTS runtime. Remove that extra
          # runtime only from this job's private installation, never the runner's.
          $privateRoot = [IO.Path]::GetFullPath($env:DOTNET_INSTALL_DIR)
          $shared = Join-Path $privateRoot 'shared'
          Get-ChildItem -LiteralPath $shared -Directory | Get-ChildItem -Directory |
            Where-Object { $_.Name -notlike "$env:RUNTIME_MAJOR.*" } | ForEach-Object {
              $target = [IO.Path]::GetFullPath($_.FullName)
              if (!$target.StartsWith($shared + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
                throw "Refusing to remove runtime outside the private install: $target"
              }
              Remove-Item -LiteralPath $target -Recurse -Force
            }
          @{ sdk = @{ version = $env:SDK_VERSION; rollForward = 'disable'; allowPrerelease = $false } } |
            ConvertTo-Json | Set-Content global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: artifacts/release
      - name: Extract the already-built package feed
        shell: pwsh
        run: Expand-Archive "artifacts/release/NetWiv-$env:RELEASE_VERSION-packages.zip" artifacts/consumer-feed
      - name: Install Linux package consumer build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang zlib1g-dev libgtk-3-0t64 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libxdo3 \
            xvfb xserver-xephyr xfwm4 xfce4-panel dbus-x11 x11-utils
      - name: Check macOS consumer build tools
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          xcrun --find clang
      - name: Ensure Windows WebView2 Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ensure-webview2.ps1
      - name: Execute packaged CLI, generated managed app and NativeAOT consumer
        shell: pwsh
        run: ./scripts/test-package-feed.ps1 -Feed artifacts/consumer-feed/packages -Version $env:RELEASE_VERSION -TargetFramework 'net${{ matrix.major }}.0'

  draft:
    needs: [version, bundle, package-compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-bundle
          path: release
      - name: Create or update an unpublished Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ "$draft" == true ]] || { echo 'Refusing to change a published Release.'; exit 1; }
          else
            flags=()
            [[ "$RELEASE_VERSION" != *-* ]] || flags+=(--prerelease)
            gh release create "$RELEASE_TAG" --verify-tag --draft "${flags[@]}" \
              --title "NetWiv $RELEASE_VERSION" --notes-file release/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/*.zip release/SHA256SUMS --clobber
