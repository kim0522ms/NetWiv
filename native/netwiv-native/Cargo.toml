[package]
name = "netwiv-native"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arboard = "=3.6.1"
dirs = "=6.0.0"
global-hotkey = { version = "=0.8.0", features = ["serde"] }
iota_stronghold = "=2.1.0"
crypto = { package = "iota-crypto", version = "=0.23.2", default-features = false, features = ["bip39"] }
argon2 = { package = "rust-argon2", version = "=2.1.0" }
getrandom = "=0.3.4"
zeroize = "=1.8.2"
http = "=1.3.1"
image = { version = "=0.25.10", default-features = false, features = ["ico", "png"] }
rfd = { version = "=0.16.0", default-features = false }
muda = { version = "=0.20.0", default-features = false, features = ["serde"] }
notify-rust = "=4.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri-utils = { version = "=2.9.3", default-features = false }
tao = { version = "=0.36.0", default-features = false, features = ["rwh_06"] }
tray-icon = { version = "=0.25.1", default-features = false, features = ["serde"] }
url = "=2.5.8"
wry = { version = "=0.55.1", default-features = false, features = ["protocol", "os-webview"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "=3.6.1", features = ["wayland-data-control"] }
gtk = "=0.18.2"
webkit2gtk = "=2.0.2"
rfd = { version = "=0.16.0", default-features = false, features = ["gtk3"] }
muda = { version = "=0.20.0", default-features = false, features = ["gtk3"] }
tao = { version = "=0.36.0", default-features = false, features = ["rwh_06", "x11", "dbus"] }
tray-icon = { version = "=0.25.1", default-features = false, features = ["libappindicator"] }
wry = { version = "=0.55.1", default-features = false, features = ["protocol", "os-webview", "linux-body", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
muda = { version = "=0.20.0", default-features = false, features = ["common-controls-v6"] }
rfd = { version = "=0.16.0", default-features = false, features = ["common-controls-v6"] }
tray-icon = { version = "=0.25.1", default-features = false, features = ["muda-common-controls-v6"] }
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
window-vibrancy = "=0.6.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSApplication", "NSImage", "NSResponder", "NSScreen", "NSWindow", "NSView"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSData"] }
window-vibrancy = "=0.6.0"

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "=3.0.11"

[dev-dependencies]
png = "=0.17.16"
serial_test = "=3.2.0"
stronghold_engine = "=2.0.1"
