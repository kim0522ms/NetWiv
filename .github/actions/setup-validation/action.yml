name: Set up managed validation
description: Select an isolated SDK, Node and the matching NuGet dependency cache.
inputs:
  dotnet-version:
    description: SDK version to install and pin
    default: '8.0.x'
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      id: sdk
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    - name: Pin the SDK under test
      shell: pwsh
      env:
        SDK_VERSION: ${{ steps.sdk.outputs.dotnet-version }}
      run: |
        @{ sdk = @{ version = $env:SDK_VERSION; rollForward = 'disable'; allowPrerelease = $false } } |
          ConvertTo-Json | Set-Content global.json
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'
    - name: Cache NuGet packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk.outputs.dotnet-version }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.*', '**/Directory.Packages.props', '**/NuGet.Config', '**/nuget.config') }}
        restore-keys: |
          nuget-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk.outputs.dotnet-version }}-
