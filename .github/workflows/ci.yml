name: Build and test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-artifacts:
        description: Retain native libraries for the Release package bundle
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.classify.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect build inputs
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --no-renames --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-paths"
          build=false
          while IFS= read -r -d '' file; do
            case "$file" in
              docs/*|README.md|AGENTS.md) ;;
              *) build=true ;;
            esac
          done < "$RUNNER_TEMP/changed-paths"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  desktop:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: ${{ matrix.rid }} build, tests and NativeAOT
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            target: x86_64-pc-windows-msvc
            native-directory: windows
            exe: .exe
          - os: ubuntu-24.04
            rid: linux-x64
            target: x86_64-unknown-linux-gnu
            native-directory: linux-x64
            exe: ''
          - os: macos-15
            rid: osx-arm64
            target: aarch64-apple-darwin
            native-directory: osx-arm64
            exe: ''
          - os: macos-15-intel
            rid: osx-x64
            target: x86_64-apple-darwin
            native-directory: osx-x64
            exe: ''
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/artifacts/ci-dotnet
      DOTNET_ROOT: ${{ github.workspace }}/artifacts/ci-dotnet
      NUGET_PACKAGES: ${{ github.workspace }}/.packages
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
      SODIUM_DIST_DIR: ${{ github.workspace }}/artifacts/native-source/ci

    steps:
      - name: Preserve checksum-addressed source bytes
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        id: sdk
        with:
          dotnet-version: '8.0.x'

      - name: Pin the baseline SDK (ignore other preinstalled SDKs)
        shell: pwsh
        env:
          SDK_VERSION: ${{ steps.sdk.outputs.dotnet-version }}
        run: |
          @{ sdk = @{ version = $env:SDK_VERSION; rollForward = 'disable'; allowPrerelease = $false } } |
            ConvertTo-Json | Set-Content global.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ matrix.os }}-${{ matrix.rid }}-${{ hashFiles('global.json') }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.*', '**/Directory.Packages.props', '**/NuGet.Config', '**/nuget.config') }}
          restore-keys: |
            nuget-${{ matrix.os }}-${{ matrix.rid }}-${{ hashFiles('global.json') }}-

      - name: Prepare pinned NSIS compiler
        if: runner.os == 'Windows'
        run: node scripts/prepare-nsis.mjs

      - name: Windows installer lifecycle acceptance
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          # Fail packaging acceptance before the expensive native and full-solution builds.
          dotnet build src/NetWiv.Cli -c Release
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed.' }
          $wixBin = Join-Path $env:WIX 'bin'
          if (-not (Test-Path (Join-Path $wixBin 'candle.exe'))) { throw 'WiX v3 is missing from the runner.' }
          $env:PATH = "$wixBin;$env:PATH"
          ./scripts/test-windows-installers.ps1

      - name: Install Linux build and desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang pkg-config zlib1g-dev libssl-dev libsqlite3-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev \
            xvfb xserver-xephyr xfwm4 xfce4-panel dbus-x11 x11-utils

      - name: Prepare macOS build tools
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          xcrun --find clang
          brew install cmake pkgconf libsodium
          echo 'MACOSX_DEPLOYMENT_TARGET=12.0' >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: |
          rust_version=$(node -p "require('./native/dependency-lock.json').rust.channel")
          rustup toolchain install "$rust_version" --profile minimal
          echo "RUST_VERSION=$rust_version" >> "$GITHUB_ENV"

      - name: Cache native dependencies
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            artifacts/native-target
          key: native-${{ matrix.os }}-${{ matrix.rid }}-${{ hashFiles('native/Cargo.lock', 'native/dependency-lock.json', 'native/rust-toolchain.toml') }}
          restore-keys: |
            native-${{ matrix.os }}-${{ matrix.rid }}-

      - name: Prepare verified libsodium inputs
        run: node scripts/prepare-native-dependencies.mjs '${{ matrix.rid }}' artifacts/native-source/ci

      - name: Build Windows native adapter
        id: native-windows
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/build-native.ps1

      - name: Build Unix native adapter
        id: native-unix
        if: runner.os != 'Windows'
        run: bash scripts/build-native.sh

      - name: Rust unit tests
        run: |
          cargo +"$RUST_VERSION" test --locked --release --lib \
            --manifest-path native/netwiv-native/Cargo.toml \
            --target '${{ matrix.target }}' --target-dir 'artifacts/native-target/${{ matrix.native-directory }}'

      - name: Save compiled native dependencies
        if: always() && steps.native-cache.outputs.cache-hit != 'true' && (steps.native-windows.outcome == 'success' || steps.native-unix.outcome == 'success')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            artifacts/native-target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Build .NET solution
        run: dotnet build NetWiv.sln -c Release

      - name: Core tests
        run: dotnet run --project tests/NetWiv.Core.Tests -c Release --no-build

      - name: Prepare pinned CLI test tools
        run: node scripts/prepare-test-tools.mjs

      - name: macOS app and DMG packaging
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: dotnet run --project tests/NetWiv.Cli.Tests -c Release --no-build -- --filter 'macOS application'

      - name: CLI tests
        # The signer interoperability test executes the upstream minisign binary.
        run: |
          dotnet run --project tests/NetWiv.Cli.Tests -c Release --no-build -- --exclude 'macOS application'

      - name: Generator tests
        run: dotnet test tests/NetWiv.Generators.Tests -c Release --no-build

      - name: API tests
        run: dotnet test tests/NetWiv.Api.Tests -c Release --no-build

      - name: Shared JavaScript harness and license tests
        if: runner.os == 'Linux'
        run: |
          node --test tests/conformance/scripts/*.test.mjs \
            tests/NetWiv.Desktop.Smoke/*.test.mjs \
            tests/NetWiv.Isolation.Smoke/*.test.mjs \
            compatibility/scripts/upstream-test-inventory.test.mjs \
            native/license-provenance.test.mjs

      - name: Windows owned-host cleanup tests
        if: runner.os == 'Windows'
        run: node --test tests/conformance/scripts/run-host.test.mjs tests/NetWiv.Isolation.Smoke/run.test.mjs

      - name: Platform build-tool script tests
        run: |
          node --test scripts/*.test.mjs

      - name: Release bundle tests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p 'test_release_packages.py' -v

      - name: Package consumer project tests
        shell: pwsh
        run: |
          ./scripts/test-package-smoke.ps1

      - name: Publish Core tests with NativeAOT
        run: dotnet publish tests/NetWiv.Core.Tests -c Release -r '${{ matrix.rid }}' -p:PublishAot=true -o artifacts/ci/core-aot

      - name: Execute NativeAOT Core tests
        run: ./artifacts/ci/core-aot/NetWiv.Core.Tests${{ matrix.exe }}

      - name: Publish native desktop smoke host with NativeAOT
        run: dotnet publish tests/NetWiv.Desktop.Smoke -c Release -r '${{ matrix.rid }}' -p:PublishAot=true -o artifacts/ci/desktop-aot

      - name: Windows native startup diagnostics
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/test-native-startup.ps1 -PublishedDirectory artifacts/ci/desktop-aot

      - name: Unix native startup diagnostics
        if: runner.os != 'Windows'
        run: bash scripts/test-native-startup.sh artifacts/ci/desktop-aot

      - name: Ensure Windows WebView2 Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ensure-webview2.ps1

      - name: Windows NativeAOT WebView smoke
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke.exe

      - name: Linux X11 NativeAOT WebView smoke
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' \
            bash scripts/run-linux-smoke-desktop.sh "$(realpath artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke)" x11

      - name: Build Linux managed dialog regression host
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          node tests/conformance/scripts/build-frontend.mjs
          dotnet build tests/NetWiv.Dialog.Smoke -c Release -p:PublishAot=false

      - name: Linux X11 managed dialog regression
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' \
            bash scripts/run-linux-smoke-desktop.sh "$(realpath tests/NetWiv.Dialog.Smoke/bin/Release/net8.0/NetWiv.Dialog.Smoke)" x11 --automatic x11

      - name: Publish Linux dialog regression host with NativeAOT
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: dotnet publish tests/NetWiv.Dialog.Smoke -c Release -r linux-x64 -p:PublishAot=true -o artifacts/ci/dialog-aot

      - name: Linux X11 NativeAOT dialog regression
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' \
            bash scripts/run-linux-smoke-desktop.sh "$(realpath artifacts/ci/dialog-aot/NetWiv.Dialog.Smoke)" x11 --automatic x11

      - name: macOS NativeAOT WKWebView smoke
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: |
          ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke --no-window-smoke
          ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke --effects-smoke
          ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke --webview-options-smoke
          ./artifacts/ci/desktop-aot/NetWiv.Desktop.Smoke

      - name: Publish macOS isolation smoke with NativeAOT
        if: runner.os == 'macOS'
        run: dotnet publish tests/NetWiv.Isolation.Smoke -c Release -r '${{ matrix.rid }}' -p:PublishAot=true -o artifacts/ci/isolation-aot

      - name: macOS NativeAOT isolation smoke
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          ./artifacts/ci/isolation-aot/NetWiv.Isolation.Smoke

      - name: macOS NativeAOT App Sandbox package
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: |
          cli="$PWD/src/NetWiv.Cli/bin/Release/net8.0/netwiv.dll"
          cd tests/NetWiv.MacOS.Sandbox.Smoke
          dotnet "$cli" build --aot --target '${{ matrix.rid }}' --bundles app-store --no-sign
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          mkdir "$scratch/outside"
          export NETWIV_SANDBOX_OUTSIDE_DIRECTORY="$scratch/outside"
          pkgutil --expand-full target/'${{ matrix.rid }}'/release/bundle/app-store/*-unsigned.pkg "$scratch/expanded"
          app="$scratch/expanded/dev.netwiv.sandbox-smoke.pkg/Payload/NetWiv-Sandbox-Smoke.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/NetWiv.MacOS.Sandbox.Smoke" --sandbox write
          "$app/Contents/MacOS/NetWiv.MacOS.Sandbox.Smoke" --sandbox read

      - name: Upload validated native libraries for packaging
        if: inputs.release-artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native/
          retention-days: 1
          if-no-files-found: error

  sdk-compatibility:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: .NET ${{ matrix.major }} SDK and runtime compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        major: [9, 10]
    env:
      NetWivTestFramework: net${{ matrix.major }}.0
      DOTNET_NOLOGO: '1'
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/artifacts/ci-dotnet
      DOTNET_ROOT: ${{ github.workspace }}/artifacts/ci-dotnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        id: sdk
        with:
          dotnet-version: '${{ matrix.major }}.0.x'
      - name: Pin the SDK under test
        shell: pwsh
        env:
          SDK_VERSION: ${{ steps.sdk.outputs.dotnet-version }}
        run: |
          @{ sdk = @{ version = $env:SDK_VERSION; rollForward = 'disable'; allowPrerelease = $false } } |
            ConvertTo-Json | Set-Content global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Prepare AOT and CLI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev
          node scripts/prepare-test-tools.mjs
      - name: Build and test managed consumers
        run: |
          dotnet run --project tests/NetWiv.Core.Tests -c Release
          dotnet run --project tests/NetWiv.Cli.Tests -c Release
          dotnet test tests/NetWiv.Generators.Tests -c Release
          dotnet test tests/NetWiv.Api.Tests -c Release
      - name: Publish and execute NativeAOT Core tests
        run: |
          dotnet publish tests/NetWiv.Core.Tests -c Release -r linux-x64 -p:PublishAot=true -o artifacts/sdk-core-aot
          ./artifacts/sdk-core-aot/NetWiv.Core.Tests

  required:
    name: CI required
    if: always()
    needs: [changes, desktop, sdk-compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful validation or documentation-only changes
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_REQUIRED: ${{ needs.changes.outputs.build }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          SDK_RESULT: ${{ needs.sdk-compatibility.result }}
        run: |
          [[ "$CHANGES_RESULT" == success ]] || exit 1
          case "$BUILD_REQUIRED:$DESKTOP_RESULT:$SDK_RESULT" in
            true:success:success|false:skipped:skipped) exit 0 ;;
            *) echo "Required validation did not pass: $BUILD_REQUIRED:$DESKTOP_RESULT:$SDK_RESULT"; exit 1 ;;
          esac
