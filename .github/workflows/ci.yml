name: Build and test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.rid }} build, tests and NativeAOT
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            target: x86_64-pc-windows-msvc
            native-directory: windows
            exe: .exe
          - os: ubuntu-24.04
            rid: linux-x64
            target: x86_64-unknown-linux-gnu
            native-directory: linux-x64
            exe: ''
          - os: macos-15
            rid: osx-arm64
            target: aarch64-apple-darwin
            native-directory: osx-arm64
            exe: ''
          - os: macos-15-intel
            rid: osx-x64
            target: x86_64-apple-darwin
            native-directory: osx-x64
            exe: ''
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUGET_PACKAGES: ${{ github.workspace }}/.packages
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
      SODIUM_DIST_DIR: ${{ github.workspace }}/artifacts/native-source/ci

    steps:
      - name: Preserve checksum-addressed source bytes
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ matrix.os }}-${{ matrix.rid }}-${{ hashFiles('global.json') }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.*', '**/Directory.Packages.props', '**/NuGet.Config', '**/nuget.config') }}
          restore-keys: |
            nuget-${{ matrix.os }}-${{ matrix.rid }}-${{ hashFiles('global.json') }}-

      - name: Install Linux build and desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang pkg-config zlib1g-dev libssl-dev libsqlite3-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev \
            xvfb xserver-xephyr xfwm4 xfce4-panel dbus-x11 x11-utils

      - name: Prepare macOS build tools
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          xcrun --find clang
          brew install cmake pkgconf libsodium
          echo 'MACOSX_DEPLOYMENT_TARGET=12.0' >> "$GITHUB_ENV"

      - name: Install pinned Rust toolchain
        run: |
          rust_version=$(node -p "require('./native/dependency-lock.json').rust.channel")
          rustup toolchain install "$rust_version" --profile minimal
          echo "RUST_VERSION=$rust_version" >> "$GITHUB_ENV"
          mkdir -p artifacts/ci
          dotnet --info | tee artifacts/ci/dotnet-info.txt
          rustc +"$rust_version" --version --verbose | tee artifacts/ci/rust-info.txt

      - name: Cache native dependencies
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            artifacts/native-target
          key: native-${{ matrix.os }}-${{ matrix.rid }}-${{ hashFiles('native/Cargo.lock', 'native/dependency-lock.json', 'native/rust-toolchain.toml') }}
          restore-keys: |
            native-${{ matrix.os }}-${{ matrix.rid }}-

      - name: Prepare verified libsodium inputs
        run: node scripts/prepare-native-dependencies.mjs '${{ matrix.rid }}' artifacts/native-source/ci

      - name: Build Windows native adapter
        id: native-windows
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/build-native.ps1

      - name: Build Unix native adapter
        id: native-unix
        if: runner.os != 'Windows'
        run: bash scripts/build-native.sh

      - name: Rust unit tests
        run: |
          cargo +"$RUST_VERSION" test --locked --release --lib \
            --manifest-path native/netwiv-native/Cargo.toml \
            --target '${{ matrix.target }}' --target-dir 'artifacts/native-target/${{ matrix.native-directory }}' \
            2>&1 | tee artifacts/ci/rust-tests.log

      - name: Save compiled native dependencies
        if: always() && steps.native-cache.outputs.cache-hit != 'true' && (steps.native-windows.outcome == 'success' || steps.native-unix.outcome == 'success')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            artifacts/native-target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Build .NET solution
        run: dotnet build NetWiv.slnx -c Release -bl:artifacts/ci/build.binlog

      - name: Core tests
        run: dotnet run --project tests/NetWiv.Core.Tests -c Release --no-build 2>&1 | tee artifacts/ci/core-tests.log

      - name: Prepare pinned CLI test tools
        run: node scripts/prepare-test-tools.mjs

      - name: macOS app and DMG packaging
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: dotnet run --project tests/NetWiv.Cli.Tests -c Release --no-build -- --filter 'macOS application' 2>&1 | tee artifacts/ci/macos-packaging.log

      - name: CLI tests
        # The signer interoperability test executes the upstream minisign binary.
        run: |
          dotnet run --project tests/NetWiv.Cli.Tests -c Release --no-build -- --exclude 'macOS application' 2>&1 | tee artifacts/ci/cli-tests.log

      - name: Generator tests
        run: dotnet test tests/NetWiv.Generators.Tests -c Release --no-build --logger trx --results-directory artifacts/ci/generator

      - name: API tests
        run: dotnet test tests/NetWiv.Api.Tests -c Release --no-build --logger trx --results-directory artifacts/ci/api

      - name: Shared JavaScript harness and license tests
        if: runner.os == 'Linux'
        run: |
          node --test tests/conformance/scripts/*.test.mjs \
            tests/NetWiv.Isolation.Smoke/compare.test.mjs \
            compatibility/scripts/upstream-test-inventory.test.mjs \
            native/license-provenance.test.mjs 2>&1 | tee artifacts/ci/shared-node-tests.log

      - name: Platform build-tool script tests
        run: |
          node --test scripts/*.test.mjs 2>&1 | tee artifacts/ci/node-tests.log

      - name: Publish Core tests with NativeAOT
        run: dotnet publish tests/NetWiv.Core.Tests -c Release -r '${{ matrix.rid }}' -p:PublishAot=true -o artifacts/ci/core-aot -bl:artifacts/ci/core-aot.binlog

      - name: Execute NativeAOT Core tests
        run: ./artifacts/ci/core-aot/NetWiv.Core.Tests${{ matrix.exe }} 2>&1 | tee artifacts/ci/core-aot.log

      - name: Publish native desktop smoke host with NativeAOT
        run: dotnet publish tests/NetWiv.Wry.Smoke -c Release -r '${{ matrix.rid }}' -p:PublishAot=true -o artifacts/ci/wry-aot -bl:artifacts/ci/wry-aot.binlog

      - name: Windows native startup diagnostics
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/test-native-startup.ps1 -PublishedDirectory artifacts/ci/wry-aot 2>&1 | tee artifacts/ci/startup.log

      - name: Unix native startup diagnostics
        if: runner.os != 'Windows'
        run: bash scripts/test-native-startup.sh artifacts/ci/wry-aot 2>&1 | tee artifacts/ci/startup.log

      - name: Ensure Windows WebView2 Runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @(
            "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$client",
            "HKLM:\Software\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client",
            "HKLM:\Software\Microsoft\EdgeUpdate\Clients\$client"
          )
          function Get-RuntimeVersion {
            foreach ($key in $keys) {
              $version = Get-ItemPropertyValue -Path $key -Name pv -ErrorAction SilentlyContinue
              if ($version -and $version -ne '0.0.0.0') { return $version }
            }
          }
          if (-not (Get-RuntimeVersion)) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              throw 'WebView2 installer signature verification failed.'
            }
            $process = Start-Process -FilePath $installer -ArgumentList '/silent', '/install' -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "WebView2 installation failed: $($process.ExitCode)" }
          }
          $version = Get-RuntimeVersion
          if (-not $version) { throw 'WebView2 Runtime is still missing.' }
          Write-Output "WebView2 Runtime: $version"

      - name: Windows NativeAOT WebView smoke
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: ./artifacts/ci/wry-aot/NetWiv.Wry.Smoke.exe 2>&1 | tee artifacts/ci/desktop-smoke.log

      - name: Linux X11 NativeAOT WebView smoke
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' \
            bash scripts/run-linux-smoke-desktop.sh "$(realpath artifacts/ci/wry-aot/NetWiv.Wry.Smoke)" x11 \
            2>&1 | tee artifacts/ci/desktop-smoke.log

      - name: macOS NativeAOT WKWebView smoke
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          ./artifacts/ci/wry-aot/NetWiv.Wry.Smoke --no-window-smoke 2>&1 | tee artifacts/ci/windowless-smoke.log
          ./artifacts/ci/wry-aot/NetWiv.Wry.Smoke 2>&1 | tee artifacts/ci/desktop-smoke.log

      - name: Publish macOS isolation smoke with NativeAOT
        if: runner.os == 'macOS'
        run: dotnet publish tests/NetWiv.Isolation.Smoke -c Release -r '${{ matrix.rid }}' -p:PublishAot=true -o artifacts/ci/isolation-aot -bl:artifacts/ci/isolation-aot.binlog

      - name: macOS NativeAOT isolation smoke
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          NETWIV_ISOLATION_REPORT="$PWD/artifacts/ci/isolation.json" \
            ./artifacts/ci/isolation-aot/NetWiv.Isolation.Smoke 2>&1 | tee artifacts/ci/isolation.log

      - name: Upload test logs and NativeAOT executables
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-${{ matrix.rid }}
          path: artifacts/ci/
          retention-days: 7
          if-no-files-found: warn
